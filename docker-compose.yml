# CloudPhone 一体化部署。
# 注意：接真机时后端容器需要访问宿主机的 adb；最简单的方式是 network_mode: host
# 并在宿主机跑 adb server，或把 /dev/bus/usb 透传进容器。此处给出基础编排。
services:
  backend:
    build: ./backend
    container_name: cloudphone-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MOCK_DEVICES=${MOCK_DEVICES:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/assets:/app/assets
    # 接真机请取消注释，让容器直连宿主机 adb：
    # network_mode: host

  frontend:
    build: ./frontend
    container_name: cloudphone-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:3000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
